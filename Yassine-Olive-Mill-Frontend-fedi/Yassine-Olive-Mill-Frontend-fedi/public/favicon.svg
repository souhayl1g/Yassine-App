<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background circle -->
  <defs>
    <linearGradient id="oliveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#oliveGrad)"/>
  
  <!-- Olive branch -->
  <path d="M180 200 Q 200 180 220 190 Q 240 200 260 190 Q 280 180 300 200" 
        stroke="#065F46" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Olive leaves -->
  <ellipse cx="210" cy="185" rx="15" ry="30" fill="#10B981" transform="rotate(-30 210 185)"/>
  <ellipse cx="240" cy="180" rx="15" ry="30" fill="#10B981" transform="rotate(-10 240 180)"/>
  <ellipse cx="270" cy="185" rx="15" ry="30" fill="#10B981" transform="rotate(30 270 185)"/>
  
  <!-- Olives (fruits) -->
  <circle cx="205" cy="210" r="18" fill="#7C2D12"/>
  <circle cx="240" cy="205" r="18" fill="#7C2D12"/>
  <circle cx="275" cy="210" r="18" fill="#7C2D12"/>
  
  <!-- Shine on olives -->
  <circle cx="210" cy="205" r="6" fill="#A16207" opacity="0.6"/>
  <circle cx="245" cy="200" r="6" fill="#A16207" opacity="0.6"/>
  <circle cx="280" cy="205" r="6" fill="#A16207" opacity="0.6"/>
  
  <!-- Oil drops -->
  <path d="M 200 280 Q 200 250 220 250 Q 240 250 240 280 Q 240 310 220 310 Q 200 310 200 280 Z" 
        fill="url(#oilGrad)" opacity="0.9"/>
  <path d="M 240 290 Q 240 260 260 260 Q 280 260 280 290 Q 280 320 260 320 Q 240 320 240 290 Z" 
        fill="url(#oilGrad)" opacity="0.85"/>
  <path d="M 280 280 Q 280 250 300 250 Q 320 250 320 280 Q 320 310 300 310 Q 280 310 280 280 Z" 
        fill="url(#oilGrad)" opacity="0.8"/>
  
  <!-- Bottle silhouette -->
  <path d="M 230 340 L 230 360 Q 230 370 240 370 L 270 370 Q 280 370 280 360 L 280 340 L 275 330 L 235 330 Z" 
        fill="#065F46" opacity="0.3"/>
</svg>